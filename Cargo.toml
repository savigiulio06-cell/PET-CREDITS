[workspace]
resolver = "2"
members = ["crates/pet-core", "app/src-tauri"]
default-members = ["crates/pet-core", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/savigiulio06-cell/PET-CREDITS"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
dirs = "6"
ureq = { version = "3", features = ["json"] }
tempfile = "3"
